name: 🧪 Test Translator (GitHub Actions Runner)

on:
  workflow_dispatch: # Actions sekmesinden tek tıkla elle tetikleme
  push:
    paths:
      - '.github/workflows/test_translator.yml'
      - 'test_translation.py'
      - 'src/translator.py'

jobs:
  test-translator:
    name: 🌐 Çeviri Motoru Testi (Ubuntu Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          pip install -r requirements.txt

      - name: 🧪 Çeviri Testini Çalıştır
        run: |
          python test_translation.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
